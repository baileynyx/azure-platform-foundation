name: Terraform validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.9.8'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test
  plan-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.9.8'
          # Python captures raw show -json output and real process exit codes.
          terraform_wrapper: false
      - name: Test the plan review policy and public CLI
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Demonstrate synthetic Azure plan decisions
        run: |
          python plan_review.py examples/plans/safe.json --output reports/plan-review/safe.md
          # Only the documented review-required exit is expected. A crash or
          # invalid input must fail CI instead of masquerading as a blocked plan.
          if python plan_review.py examples/plans/destructive.json --output reports/plan-review/destructive.md; then
            echo 'Destructive fixture unexpectedly passed.'
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi
          cat reports/plan-review/safe.md reports/plan-review/destructive.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check real Terraform JSON with temporary local state
        run: python check_plan_contract.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: terraform-plan-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/plan-review/
          retention-days: 14
          if-no-files-found: error
  drift-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.9.8'
          # The rehearsal checks native 0/1/2 codes and parses show -json itself.
          terraform_wrapper: false
      - name: Observe local drift without recovery
        run: python rehearse_drift.py --output-dir reports/drift/detection
      - name: Rehearse checked local recovery and teardown
        run: python rehearse_drift.py --recover-local-fixture --output-dir reports/drift/recovery
      - name: Publish the observed drift and recovery summary
        run: cat reports/drift/recovery/drift-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: terraform-drift-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          # This directory contains only selected JSON/Markdown evidence. Full
          # Terraform state and saved plans remain in the deleted temporary root.
          path: reports/drift/
          retention-days: 14
          if-no-files-found: error

  ai-review:
    name: AI review contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      # Keep subprocess recordings portable across Windows code pages. This job
      # deliberately has no model key and cannot claim a live AI evaluation.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test AI privacy, evidence, CLI and intercepted HTTP boundaries
        run: python -m unittest discover -s tests -p 'test_ai*.py' -v
      - name: Evaluate the offline baseline and adversarial response probes
        run: python evaluate_ai_review.py --output-dir reports/ai-evaluation
      - name: Record actual CLI output without live inference
        run: python record_ai_demo.py --output-dir reports/ai-recording
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-review-offline-${{ matrix.os }}-${{ github.run_id }}
          # Only synthetic fixtures are used; real local plans are never uploaded.
          path: |
            reports/ai-evaluation/
            reports/ai-recording/
          retention-days: 14
          if-no-files-found: error

  ai-service-terraform:
    name: Azure AI service Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.9.8'
      - name: Check isolated AI service formatting
        run: terraform -chdir=examples/ai-service fmt -check -recursive
      - name: Initialize the reviewed provider without a backend
        run: terraform -chdir=examples/ai-service init -backend=false -input=false -lockfile=readonly
      - name: Validate the actual provider schema
        run: terraform -chdir=examples/ai-service validate
      - name: Run credential-free AI service mock contracts
        # The mock provider avoids Azure API calls. This is not live deployment.
        run: terraform -chdir=examples/ai-service test
